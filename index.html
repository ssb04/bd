<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bizim Hikayemiz | İyi ki Doğdun Gülümmmm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..900;1,400..900&family=Poppins:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-dark: #0b0307;
        --c-wine: #3a0715;
        --c-red: #ff2d55;
        --c-hot: #ff5c8a;
        --c-light: #ffc2d4;
        --c-cream: #fff4f7;
        --f-serif: "Playfair Display", Georgia, serif;
        --f-sans: "Poppins", sans-serif;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--c-cream);
        font-family: var(--f-sans);
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      /* Film Grain / Noise Katmanı */
      .noise {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.045;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* Dinamik Arka Plan & Işık Huzmesi */
      .bg-layer {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(
          circle at 50% 50%,
          var(--c-wine) 0%,
          var(--bg-dark) 85%
        );
        transition: background 1.5s ease;
      }
      .ambient-flare {
        position: fixed;
        width: 45vw;
        height: 45vw;
        background: radial-gradient(
          circle,
          rgba(255, 45, 85, 0.22) 0%,
          transparent 70%
        );
        border-radius: 50%;
        filter: blur(60px);
        z-index: 0;
        pointer-events: none;
        animation: moveFlare 12s infinite alternate ease-in-out;
      }
      @keyframes moveFlare {
        0% {
          transform: translate(-10vw, -10vh) scale(1);
        }
        100% {
          transform: translate(55vw, 45vh) scale(1.3);
        }
      }

      canvas {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      /* Üst İlerleme Çubukları (Instagram Stories) */
      .story-header {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .story-bars {
        display: flex;
        gap: 3px;
        width: 100%;
      }
      .bar-wrap {
        flex: 1;
        height: 3px;
        background: rgba(255, 244, 247, 0.18);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--c-hot), var(--c-cream));
        border-radius: 3px;
      }
      .story-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
        color: rgba(255, 244, 247, 0.5);
        padding: 0 4px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* Tıklama Alanları */
      .tap-left,
      .tap-right {
        position: fixed;
        top: 0;
        height: 100vh;
        z-index: 90;
      }
      .tap-left {
        left: 0;
        width: 30vw;
        cursor: w-resize;
      }
      .tap-right {
        right: 0;
        width: 70vw;
        cursor: e-resize;
      }

      /* Ana Sahne ve Slaytlar */
      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 24px 40px;
      }
      .slide-content {
        width: 100%;
        max-width: 960px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* Stagger Giriş / Çıkış Animasyonları */
      .stagger-item {
        opacity: 0;
        transform: translateY(32px) scale(0.98);
        transition:
          opacity 0.75s var(--ease-out),
          transform 0.75s var(--ease-out);
      }
      .slide-active .stagger-item {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .slide-exit .stagger-item {
        opacity: 0;
        transform: translateY(-15px) scale(1.06);
        transition:
          opacity 0.45s ease,
          transform 0.45s ease;
      }

      /* Tipografi ve Etiketler */
      .tag {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 2.5px;
        color: var(--c-light);
        text-transform: uppercase;
        background: rgba(255, 45, 85, 0.14);
        border: 1px solid rgba(255, 194, 212, 0.28);
        padding: 7px 18px;
        border-radius: 30px;
        margin-bottom: 18px;
        backdrop-filter: blur(8px);
      }

      .title-serif {
        font-family: var(--f-serif);
        font-style: italic;
        font-weight: 700;
        font-size: clamp(2.2rem, 5.5vw, 4.4rem);
        line-height: 1.15;
        background: linear-gradient(180deg, #ffffff 0%, var(--c-light) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 8px 25px rgba(255, 45, 85, 0.25));
        margin-bottom: 14px;
      }

      .giant-number {
        font-family: var(--f-sans);
        font-weight: 900;
        font-size: clamp(4.8rem, 16vw, 11.5rem);
        line-height: 0.95;
        font-variant-numeric: tabular-nums;
        background: linear-gradient(
          135deg,
          var(--c-red) 0%,
          var(--c-hot) 50%,
          var(--c-light) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 35px rgba(255, 45, 85, 0.45));
        margin: 10px 0;
      }

      .unit-label {
        font-family: var(--f-serif);
        font-style: italic;
        font-weight: 600;
        font-size: clamp(1.5rem, 3.5vw, 2.4rem);
        color: var(--c-light);
        margin-top: -5px;
        margin-bottom: 12px;
      }

      .desc {
        font-size: clamp(1.05rem, 2.2vw, 1.35rem);
        line-height: 1.6;
        color: rgba(255, 244, 247, 0.9);
        max-width: 680px;
        font-weight: 400;
        margin-top: 12px;
      }
      .desc strong {
        color: var(--c-light);
        font-weight: 700;
      }

      /* Mesaj Balonları */
      .chat-container {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        max-width: 620px;
        margin: 16px 0;
      }
      .bubble {
        position: relative;
        padding: 16px 22px;
        border-radius: 20px;
        text-align: left;
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.5;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
      }
      .bubble.me {
        align-self: flex-end;
        background: linear-gradient(
          135deg,
          rgba(255, 45, 85, 0.35),
          rgba(58, 7, 21, 0.85)
        );
        border: 1px solid rgba(255, 92, 138, 0.45);
        border-bottom-right-radius: 4px;
      }
      .bubble.her {
        align-self: flex-start;
        background: rgba(255, 244, 247, 0.09);
        border: 1px solid rgba(255, 194, 212, 0.25);
        border-bottom-left-radius: 4px;
      }
      .bubble-sender {
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
        display: block;
      }
      .bubble.me .bubble-sender {
        color: var(--c-light);
      }
      .bubble.her .bubble-sender {
        color: var(--c-hot);
      }
      .bubble-meta {
        display: block;
        text-align: right;
        font-size: 0.72rem;
        color: rgba(255, 244, 247, 0.55);
        margin-top: 6px;
        font-weight: 600;
      }

      /* Glassmorphism Kartlar & Karşılaştırma */
      .cards-row {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        justify-content: center;
        width: 100%;
        margin: 18px 0;
      }
      .glass-card {
        flex: 1;
        min-width: 200px;
        max-width: 300px;
        background: rgba(58, 7, 21, 0.45);
        border: 1px solid rgba(255, 194, 212, 0.22);
        padding: 22px 24px;
        border-radius: 22px;
        backdrop-filter: blur(12px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }
      .glass-card.highlight {
        background: rgba(255, 45, 85, 0.18);
        border-color: rgba(255, 92, 138, 0.55);
      }
      .card-label {
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--c-light);
        margin-bottom: 6px;
      }
      .card-num {
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        font-weight: 900;
        color: var(--c-cream);
        font-variant-numeric: tabular-nums;
      }
      .card-sub {
        font-size: 0.8rem;
        color: rgba(255, 244, 247, 0.65);
        margin-top: 4px;
      }

      .vs-bar-wrap {
        width: 100%;
        max-width: 560px;
        height: 14px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        margin: 10px 0 8px;
        padding: 2px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .vs-left {
        height: 100%;
        background: linear-gradient(90deg, var(--c-red), var(--c-hot));
        border-radius: 20px 0 0 20px;
        transition: width 1.8s var(--ease-out);
      }
      .vs-right {
        height: 100%;
        background: var(--c-light);
        border-radius: 0 20px 20px 0;
        transition: width 1.8s var(--ease-out);
      }

      /* Yatay Sözlük Çubukları */
      .bars-list {
        width: 100%;
        max-width: 620px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin: 16px 0;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .bar-word {
        width: 150px;
        text-align: right;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--c-cream);
      }
      .bar-track {
        flex: 1;
        height: 28px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 194, 212, 0.15);
      }
      .bar-fill-inner {
        height: 100%;
        width: 0%;
        background: linear-gradient(
          90deg,
          var(--c-red),
          var(--c-hot),
          var(--c-light)
        );
        border-radius: 14px;
        transition: width 1.8s var(--ease-out) 0.3s;
      }
      .bar-count {
        width: 85px;
        text-align: left;
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--c-light);
        font-variant-numeric: tabular-nums;
      }

      /* SVG Daire Sayaç */
      .circle-box {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 35px;
        margin: 10px 0;
      }
      .circle-svg {
        position: absolute;
        width: 115%;
        height: 115%;
        transform: rotate(-90deg);
        pointer-events: none;
      }
      .circle-track {
        fill: none;
        stroke: rgba(255, 194, 212, 0.12);
        stroke-width: 3;
      }
      .circle-prog {
        fill: none;
        stroke: var(--c-hot);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-dasharray: 283;
        stroke-dashoffset: 283;
        transition: stroke-dashoffset 2.4s var(--ease-out) 0.2s;
        filter: drop-shadow(0 0 8px var(--c-red));
      }

      /* Takvim Kartı */
      .cal-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        flex-wrap: wrap;
        margin: 15px 0;
      }
      .cal-card {
        width: 155px;
        background: var(--c-cream);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        transform: rotate(-4deg);
      }
      .cal-header {
        background: var(--c-red);
        color: #fff;
        font-weight: 900;
        font-size: 1rem;
        letter-spacing: 2px;
        padding: 10px 0;
        text-transform: uppercase;
      }
      .cal-day {
        color: var(--bg-dark);
        font-size: 4.4rem;
        font-weight: 900;
        line-height: 1;
        padding: 12px 0 4px;
      }
      .cal-year {
        color: #666;
        font-weight: 700;
        font-size: 0.95rem;
        padding-bottom: 12px;
      }

      /* Analog Saat */
      .clock-wrap {
        position: relative;
        width: 190px;
        height: 190px;
        margin: 14px auto;
      }
      .clock-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 25px rgba(255, 92, 138, 0.35));
      }
      .clock-hand {
        transform-origin: 50px 50px;
        transition: transform 2.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s;
      }

      /* Yüzen Emojiler */
      .emoji-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        margin: 20px 0;
      }
      .emoji-pill {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 194, 212, 0.25);
        border-radius: 60px;
        padding: 20px 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 115px;
        backdrop-filter: blur(8px);
        animation: floatPill 3.5s infinite ease-in-out alternate;
      }
      .emoji-pill:nth-child(1) {
        background: rgba(255, 45, 85, 0.22);
        border-color: var(--c-hot);
        transform: scale(1.08);
      }
      .emoji-pill:nth-child(2) {
        animation-delay: 0.6s;
      }
      .emoji-pill:nth-child(3) {
        animation-delay: 1.2s;
      }
      .emoji-pill:nth-child(4) {
        animation-delay: 1.8s;
      }
      .emoji-pill:nth-child(5) {
        animation-delay: 2.4s;
      }
      .emoji-icon {
        font-size: 2.8rem;
        line-height: 1;
      }
      .emoji-val {
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--c-cream);
        font-variant-numeric: tabular-nums;
      }
      @keyframes floatPill {
        0% {
          transform: translateY(-7px);
        }
        100% {
          transform: translateY(7px);
        }
      }

      /* Hitap Zaman Çizelgesi */
      .timeline-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        max-width: 720px;
        margin: 16px 0;
      }
      .tl-badge {
        background: rgba(255, 45, 85, 0.15);
        border: 1px solid rgba(255, 194, 212, 0.3);
        padding: 12px 18px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 145px;
      }
      .tl-date {
        font-size: 0.72rem;
        color: var(--c-light);
        font-weight: 700;
        letter-spacing: 1px;
      }
      .tl-word {
        font-family: var(--f-serif);
        font-style: italic;
        font-size: 1.35rem;
        font-weight: 700;
        color: #fff;
      }

      /* Final Kalp & Daktilo */
      .big-heart-svg {
        width: 110px;
        height: 110px;
        margin-bottom: 12px;
        filter: drop-shadow(0 0 35px var(--c-red));
        animation: pulseHeart 1.2s infinite ease-in-out;
      }
      @keyframes pulseHeart {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.14);
        }
      }
      .typewriter-box {
        background: rgba(58, 7, 21, 0.55);
        border: 1px solid rgba(255, 194, 212, 0.3);
        padding: 24px 30px;
        border-radius: 24px;
        max-width: 680px;
        min-height: 120px;
        margin: 16px 0;
        backdrop-filter: blur(12px);
        font-size: clamp(1.05rem, 2.2vw, 1.3rem);
        line-height: 1.65;
        color: var(--c-cream);
        font-weight: 500;
      }
      .tw-cursor {
        display: inline-block;
        width: 3px;
        height: 1.1em;
        background: var(--c-hot);
        margin-left: 4px;
        vertical-align: middle;
        animation: blink 0.75s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      /* Başlangıç & Hız Seçim Ekranı */
      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: radial-gradient(circle at 50% 50%, #3a0715 0%, #0b0307 85%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        transition: opacity 0.8s ease;
      }
      .speed-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 24px;
      }
      .speed-opt {
        background: rgba(255, 244, 247, 0.06);
        border: 1px solid rgba(255, 194, 212, 0.25);
        color: var(--c-cream);
        font-family: var(--f-sans);
        font-size: 0.85rem;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .speed-opt:hover {
        border-color: var(--c-hot);
        background: rgba(255, 45, 85, 0.15);
      }
      .speed-opt.selected {
        background: rgba(255, 45, 85, 0.3);
        border-color: var(--c-hot);
        color: #fff;
        box-shadow: 0 0 18px rgba(255, 45, 85, 0.35);
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--c-red), var(--c-hot));
        color: #fff;
        font-family: var(--f-sans);
        font-weight: 800;
        font-size: 1.1rem;
        padding: 16px 42px;
        border: 1px solid var(--c-light);
        border-radius: 50px;
        cursor: pointer;
        margin-top: 24px;
        box-shadow: 0 0 35px rgba(255, 45, 85, 0.5);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
        position: relative;
        z-index: 150;
      }
      .btn-primary:hover {
        transform: scale(1.05);
        box-shadow: 0 0 50px rgba(255, 92, 138, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="noise"></div>
    <div class="bg-layer" id="bgLayer"></div>
    <div class="ambient-flare"></div>
    <canvas id="fxCanvas"></canvas>

    <!-- Başlangıç Ekranı -->
    <div id="start-overlay">
      <div class="tag">14 KASIM • DOĞUM GÜNÜ SÜRPRİZİ</div>
      <h1 class="title-serif" style="font-size: clamp(2.8rem, 7vw, 5.2rem)">
        Sami & Gül<br />550 Günün Hikayesi
      </h1>
      <p class="desc">BAŞLAYALIM O ZAMAN KÜÇÜK HANIM 😘</p>

      <div class="speed-selector" id="speedSelector">
        <button type="button" class="speed-opt" data-mult="1.0">
          Hızlı (1x)
        </button>
        <button type="button" class="speed-opt selected" data-mult="1.4">
          Rahat Okuma (1.4x)
        </button>
        <button type="button" class="speed-opt" data-mult="1.8">
          Yavaş (1.8x)
        </button>
        <button type="button" class="speed-opt" data-mult="0">
          Manuel Geçiş (Sadece Tık/Tuş)
        </button>
      </div>

      <button class="btn-primary" id="startBtn">Hikayemizi Başlat ❤️</button>
    </div>

    <!-- Üst Hikaye Çubuğu -->
    <div class="story-header">
      <div class="story-bars" id="storyBars"></div>
      <div class="story-meta">
        <span id="chapterTitle">BÖLÜM 1 • BAŞLANGIÇ</span>
        <span id="slideCounter">1 / 29</span>
      </div>
    </div>

    <!-- Tıklama Alanları -->
    <div class="tap-left" id="tapLeft"></div>
    <div class="tap-right" id="tapRight"></div>

    <!-- Dinamik Sahne -->
    <div class="stage">
      <div class="slide-content" id="slideContent"></div>
    </div>

    <script>
      let SURE_CARPANI = 1.4;

      const slidesData = [
        // --- BÖLÜM 1: BAŞLANGIÇ VE KUSURSUZ SÜREKLİLİK ---
        {
          chapter: "BÖLÜM 1 • BAŞLANGIÇ",
          bg: "radial-gradient(circle at 50% 40%, #4A091C 0%, #0B0307 85%)",
          dur: 7500,
          render: () => `

        }
        draw() {
          if (this.alpha <= 0) return;
          ctx.save();
          ctx.globalAlpha = Math.max(0, this.alpha);
          ctx.fillStyle = this.color;
          const drawX = this.isBurst
            ? this.x
            : this.x + Math.sin(this.swing) * 15;
          ctx.translate(drawX, this.y);
          ctx.beginPath();
          const s = this.size;
          const topCurve = s * 0.3;
          ctx.moveTo(0, topCurve);
          ctx.bezierCurveTo(0, 0, -s / 2, 0, -s / 2, topCurve);
          ctx.bezierCurveTo(-s / 2, s, 0, s * 1.3, 0, s * 1.55);
          ctx.bezierCurveTo(0, s * 1.3, s / 2, s, s / 2, topCurve);
          ctx.bezierCurveTo(s / 2, 0, 0, 0, 0, topCurve);
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = 0; i < 50; i++) particles.push(new HeartParticle(false));

      function triggerHeartBurst(x = cw / 2, y = ch / 2, count = 55) {
        for (let i = 0; i < count; i++) {
          particles.push(new HeartParticle(true, x, y));
        }
      }

      function animateCanvas() {
        ctx.clearRect(0, 0, cw, ch);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw();
          if (p.isBurst && p.alpha <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animateCanvas);
      }
      animateCanvas();

      // ==========================================
      // 3. SLAYT YÖNETİCİSİ VE SÜRE KONTROLÜ
      // ==========================================
      const storyBarsEl = document.getElementById("storyBars");
      const slideContentEl = document.getElementById("slideContent");
      const bgLayerEl = document.getElementById("bgLayer");
      const chapterTitleEl = document.getElementById("chapterTitle");
      const slideCounterEl = document.getElementById("slideCounter");

      let currentIndex = 0;
      let slideTimeout = null;
      let finaleInterval = null;
      let typewriterTimeout = null;
      let isPaused = false;
      let barFills = [];

      // Başlangıç Ekranı Hız Seçici
      document.querySelectorAll(".speed-opt").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          document
            .querySelectorAll(".speed-opt")
            .forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          SURE_CARPANI = parseFloat(btn.getAttribute("data-mult"));
        });
      });

      // Üstteki İlerleme Çubuklarını Oluştur
      slidesData.forEach(() => {
        const w = document.createElement("div");
        w.className = "bar-wrap";
        const f = document.createElement("div");
        f.className = "bar-fill";
        w.appendChild(f);
        storyBarsEl.appendChild(w);
        barFills.push(f);
      });

      function formatTurkishNumber(n) {
        return Math.floor(n)
          .toString()
          .replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      }

      function easeOutExpo(x) {
        return x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
      }

      function runInnerAnimations(slideObj) {
        const counters = slideContentEl.querySelectorAll(".count-up");
        counters.forEach((el) => {
          const target = parseInt(el.getAttribute("data-target"), 10);
          if (isNaN(target)) return;
          const duration = 2100;
          let startTs = null;
          function step(ts) {
            if (!startTs) startTs = ts;
            const prog = Math.min((ts - startTs) / duration, 1);
            const val = easeOutExpo(prog) * target;
            el.textContent = formatTurkishNumber(val);
            if (prog < 1) requestAnimationFrame(step);
            else el.textContent = formatTurkishNumber(target);
          }
          requestAnimationFrame(step);
        });

        const circleProg = slideContentEl.querySelector(".circle-prog");
        if (circleProg) {
          setTimeout(() => {
            circleProg.style.strokeDashoffset = "0";
          }, 150);
        }

        const bars = slideContentEl.querySelectorAll(
          ".vs-left, .vs-right, .bar-fill-inner",
        );
        bars.forEach((b) => {
          const targetW = b.getAttribute("data-w");
          b.style.width = "0%";
          setTimeout(() => {
            b.style.width = targetW;
          }, 250);
        });

        if (slideObj.clock) {
          const hHand = document.getElementById("hHand");
          const mHand = document.getElementById("mHand");
          if (hHand && mHand) {
            hHand.style.transform = "rotate(0deg)";
            mHand.style.transform = "rotate(0deg)";
            setTimeout(() => {
              mHand.style.transform = `rotate(${360 * 4}deg)`;
              hHand.style.transform = `rotate(${360 * 2 + 330}deg)`;
            }, 150);
          }
        }

        if (slideObj.burst) {
          setTimeout(() => triggerHeartBurst(cw / 2, ch / 2, 55), 500);
        }

        if (slideObj.finale) {
          triggerHeartBurst(cw / 2, ch / 3, 70);
          finaleInterval = setInterval(() => {
            triggerHeartBurst(cw * (0.2 + Math.random() * 0.6), ch * 0.3, 35);
          }, 900);
          setTimeout(() => clearInterval(finaleInterval), 5500);

          const twEl = document.getElementById("twText");
          const finalSub = document.getElementById("finalSub");
          const replayBtn = document.getElementById("replayBtn");
          const fullMessage =
            "İyi ki doğdun, iyi ki benim kaderim oldun, iyi ki hayatıma girdin, iyi ki varsın. Bu doğum gününde yanında olamıyorum ama bugün,her gün,heran tüm kalbimle seninleyim Ay Parçam. Seni her şeyden ve herkesten çok seviyorum karıcım. Nice mutlu senelerimize! EVLEN BENİMLE OLUR MUUUUUUU HAYATIMMMMMMMMMMMMM?????????????😊❤️";
          let charIdx = 0;

          typewriterTimeout = setTimeout(() => {
            function typeChar() {
              if (charIdx < fullMessage.length) {
                twEl.textContent += fullMessage.charAt(charIdx);
                charIdx++;
                typewriterTimeout = setTimeout(typeChar, 42);
              } else {
                if (finalSub) finalSub.style.opacity = "1";
                if (replayBtn) {
                  replayBtn.style.opacity = "1";
                  replayBtn.onclick = () => goToSlide(0);
                }
              }
            }
            typeChar();
          }, 900);
        }
      }

      function goToSlide(index) {
        clearTimeout(slideTimeout);
        clearInterval(finaleInterval);
        clearTimeout(typewriterTimeout);

        if (index < 0) index = 0;
        if (index >= slidesData.length) index = slidesData.length - 1;
        currentIndex = index;

        const slideObj = slidesData[currentIndex];
        const effectiveDur =
          SURE_CARPANI === 0 ? 0 : Math.round(slideObj.dur * SURE_CARPANI);

        slideContentEl.classList.remove("slide-active");
        slideContentEl.classList.add("slide-exit");

        setTimeout(() => {
          slideContentEl.classList.remove("slide-exit");
          slideContentEl.innerHTML = slideObj.render();

          // Stagger gecikmelerini başlangıç durumu çizilmeden önce tanımla
          const items = slideContentEl.querySelectorAll(".stagger-item");
          items.forEach((el, idx) => {
            el.style.transitionDelay = `${idx * 130 + 80}ms`;
          });

          bgLayerEl.style.background = slideObj.bg;
          chapterTitleEl.textContent = slideObj.chapter;
          slideCounterEl.textContent = `${currentIndex + 1} / ${slidesData.length}`;

          barFills.forEach((fill, idx) => {
            fill.style.transition = "none";
            if (idx < currentIndex) {
              fill.style.width = "100%";
            } else if (idx === currentIndex && effectiveDur === 0) {
              fill.style.width = "100%";
            } else {
              fill.style.width = "0%";
            }
          });

          // Tarayıcıyı başlangıç stilini (opacity: 0) hesaplamaya zorla (Reflow)
          void slideContentEl.offsetHeight;
          void barFills[currentIndex].offsetWidth;

          requestAnimationFrame(() => {
            slideContentEl.classList.add("slide-active");
            runInnerAnimations(slideObj);

            if (!isPaused && effectiveDur > 0) {
              barFills[currentIndex].style.transition =
                `width ${effectiveDur}ms linear`;
              barFills[currentIndex].style.width = "100%";
            }
          });

          if (
            currentIndex < slidesData.length - 1 &&
            !isPaused &&
            effectiveDur > 0
          ) {
            slideTimeout = setTimeout(() => {
              goToSlide(currentIndex + 1);
            }, effectiveDur);
          }
        }, 280);
      }

      // Tıklama ve Klavye Kontrolleri
      document.getElementById("tapRight").addEventListener("click", () => {
        if (currentIndex < slidesData.length - 1) goToSlide(currentIndex + 1);
      });
      document.getElementById("tapLeft").addEventListener("click", () => {
        if (currentIndex > 0) goToSlide(currentIndex - 1);
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") {
          if (currentIndex < slidesData.length - 1) goToSlide(currentIndex + 1);
        } else if (e.key === "ArrowLeft") {
          if (currentIndex > 0) goToSlide(currentIndex - 1);
        } else if (e.key === " ") {
          e.preventDefault();
          isPaused = !isPaused;
          if (isPaused) {
            clearTimeout(slideTimeout);
            const computedWidth = window.getComputedStyle(
              barFills[currentIndex],
            ).width;
            barFills[currentIndex].style.transition = "none";
            barFills[currentIndex].style.width = computedWidth;
            chapterTitleEl.textContent = "⏸ DURAKLATILDI (DEVAM İÇİN BOŞLUK)";
          } else {
            goToSlide(currentIndex);
          }
        }
      });

      // Başlat Butonu
      document.getElementById("startBtn").addEventListener("click", () => {
        const overlay = document.getElementById("start-overlay");
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
          goToSlide(0);
        }, 700);
      });
    </script>
  </body>
</html>
